name: Validate CAFFIEND PLAY

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check experience.js
          node --check leaderboard.js
          node --check analytics.js
          node --check dessert-art.js
          node --check sprite-renderer.js
          node --check game.js
          node --check side-games.js
          node --check souffle-service.js
          node --check souffle-game.js
          node --check scripts/smoke-check.mjs
          node --check scripts/souffle-contract-check.mjs
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f souffle.css
          test -f souffle-v2.css
          test -f README.md
          test -f FIELD_TEST.md
          test -f SUPABASE_ACTIVATION.md
          test -f dessert-art.js
          test -f sprite-renderer.js
          test -f side-games.js
          test -f souffle-service.js
          test -f souffle-game.js
          test -f scripts/smoke-check.mjs
          test -f scripts/souffle-contract-check.mjs
          test -f assets/menu/README.md
          test -f supabase/migrations/002_digul.sql
          test -f supabase/migrations/004_souffle_mvp.sql
          test -f supabase/functions/digul-api/index.ts
          test -f supabase/functions/souffle-api/index.ts
      - name: Check CAFFIEND configuration
        run: |
          grep -q 'version: "2.0.0"' config.js
          grep -q 'gameName: "디굴디굴"' config.js
          grep -q 'period: "weekly"' config.js
          grep -q 'completionBonus: 150' config.js
          grep -q 'steps: 12' config.js
          grep -q 'souffleApi:' config.js
      - name: Run static smoke checks
        run: node scripts/smoke-check.mjs
      - name: Run souffle scoring and backend contract checks
        run: node scripts/souffle-contract-check.mjs
