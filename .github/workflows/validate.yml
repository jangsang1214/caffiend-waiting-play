name: Validate DIGUL DIGUL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check experience.js
          node --check leaderboard.js
          node --check analytics.js
          node --check dessert-art.js
          node --check sprite-renderer.js
          node --check game.js
          node --check side-games.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f README.md
          test -f dessert-art.js
          test -f sprite-renderer.js
          test -f assets/menu/menu-atlas-v2.webp
          test -f side-games.js
          test -f assets/menu/README.md
          test -f supabase/migrations/002_digul.sql
          test -f supabase/functions/digul-api/index.ts
      - name: Check DIGUL configuration
        run: |
          grep -q 'gameName: "디굴디굴"' config.js
          grep -q 'period: "weekly"' config.js
          grep -q 'completionBonus: 150' config.js
      - name: Run static smoke checks
        run: node scripts/smoke-check.mjs
