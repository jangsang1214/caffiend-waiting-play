<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f4dfc4">
  <meta name="description" content="카피엔드 디저트 합체 게임 디굴디굴">
  <title>디굴디굴 · CAFFIEND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=1.1.0">
</head>
<body>
  <main class="app" aria-live="polite">
    <div class="cafe-bg" aria-hidden="true">
      <div class="sun-glow"></div>
      <div class="window"><span></span></div>
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
      <div class="shelf shelf-a"></div>
      <div class="shelf shelf-b"></div>
      <div class="plant plant-left"></div>
      <div class="plant plant-right"></div>
      <div class="table"></div>
    </div>

    <section id="entryScreen" class="screen entry-screen active">
      <div class="entry-card">
        <div class="entry-logo" aria-label="디굴디굴">
          <strong>디굴디굴</strong>
          <small>CAFFIEND PLAY</small>
        </div>
        <p class="entry-copy">기다리는 동안 한 판</p>

        <label class="nickname-field">
          <span>닉네임</span>
          <input id="nicknameInput" maxlength="10" inputmode="text" autocomplete="nickname" placeholder="2~10자">
        </label>
        <p id="nicknameError" class="field-error" role="alert"></p>

        <button id="startButton" class="primary-button" type="button">
          <span>게임 시작</span>
          <small id="weekLabelEntry">이번 주</small>
        </button>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <header class="game-header">
        <div class="game-logo" aria-label="디굴디굴">
          <strong>디굴디굴</strong>
          <small>CAFFIEND</small>
        </div>

        <div class="header-actions">
          <button id="nicknameButton" class="player-chip" type="button" aria-label="닉네임 변경">
            <i class="leaf-mark" aria-hidden="true"></i>
            <span id="nicknameDisplay">PLAYER</span>
          </button>
          <button id="pauseButton" class="pause-button" type="button" aria-label="일시정지">Ⅱ</button>
        </div>
      </header>

      <section class="hud">
        <div class="score-card">
          <div class="hud-label"><i class="leaf-mark" aria-hidden="true"></i><span>스코어</span></div>
          <strong id="scoreValue">0</strong>
          <div class="best-line"><span class="crown-mark">♛</span><span>최고</span><b id="personalBestValue">0</b></div>
        </div>

        <div class="next-card">
          <div class="hud-label heart-label"><span>♥</span><span>다음</span></div>
          <div id="nextPreview" class="next-preview"></div>
        </div>
      </section>

      <section class="play-area">
        <div class="board-wrap">
          <div class="bowl-rim" aria-hidden="true"></div>
          <canvas id="gameCanvas" aria-label="디저트 합체 게임"></canvas>
          <div id="dropGuide" class="drop-guide">끌고 · 놓기</div>
        </div>

        <div class="rank-strip">
          <div id="connectionPill" class="live-state is-local">
            <i></i><strong id="connectionText">내 기록</strong>
          </div>
          <div class="rank-center">
            <span>내 순위</span>
            <strong id="myRankValue">–</strong>
          </div>
          <div class="rank-best">
            <span>이번 주 최고</span>
            <strong id="topScoreValue">0</strong>
          </div>
          <span id="weekLabel" class="sr-only">이번 주</span>
        </div>
      </section>

      <footer class="bottom-actions">
        <button id="recipeButton" class="footer-button" type="button">
          <span id="recipeButtonPreview" class="action-preview" aria-hidden="true"></span>
          <strong>합체 순서</strong>
          <i>›</i>
        </button>
        <button id="rankingButton" class="footer-button footer-button-rank" type="button">
          <span class="trophy-mark">★</span>
          <strong>실시간 순위</strong>
          <i>›</i>
        </button>
      </footer>
    </section>

    <section id="resultOverlay" class="overlay" aria-hidden="true">
      <div class="result-card">
        <p class="eyebrow">GAME OVER</p>
        <h2 id="resultScore">0</h2>
        <div class="result-stats">
          <div><span>이번 주 BEST</span><strong id="resultBest">0</strong></div>
          <div><span>순위</span><strong id="resultRank">–</strong></div>
        </div>
        <div class="highest-menu">
          <span>최고 메뉴</span>
          <div id="resultMenuThumb" class="mini-dessert"></div>
          <strong id="resultMenuName">로투스 수플레</strong>
        </div>
        <button id="restartButton" class="primary-button" type="button">다시 하기</button>
      </div>
    </section>

    <section id="pauseOverlay" class="overlay" aria-hidden="true">
      <div class="pause-card">
        <p class="eyebrow">PAUSE</p>
        <h2>잠깐 멈춤</h2>
        <button id="resumeButton" class="primary-button" type="button">계속</button>
      </div>
    </section>

    <section id="nicknameOverlay" class="overlay" aria-hidden="true">
      <div class="panel-card compact">
        <button class="close-button" data-close="nicknameOverlay" type="button">×</button>
        <p class="eyebrow">PLAYER</p>
        <h2>닉네임</h2>
        <label class="nickname-field">
          <input id="nicknameEditInput" maxlength="10" inputmode="text" autocomplete="nickname">
        </label>
        <p id="nicknameEditError" class="field-error"></p>
        <button id="saveNicknameButton" class="primary-button" type="button">저장</button>
      </div>
    </section>

    <section id="recipeOverlay" class="sheet" aria-hidden="true">
      <div class="sheet-backdrop" data-close="recipeOverlay"></div>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          <div>
            <p class="eyebrow">MERGE</p>
            <h2>합체 순서</h2>
          </div>
          <button class="close-button" data-close="recipeOverlay" type="button">×</button>
        </div>
        <div id="recipeList" class="recipe-list"></div>
      </div>
    </section>

    <section id="rankingOverlay" class="sheet" aria-hidden="true">
      <div class="sheet-backdrop" data-close="rankingOverlay"></div>
      <div class="sheet-panel ranking-sheet">
        <div class="sheet-handle"></div>
        <div class="ranking-hero">
          <div class="ranking-cup">★</div>
          <div>
            <p class="eyebrow">LIVE · WEEKLY</p>
            <h2>실시간 순위</h2>
            <small>이번 주 최고 기록 기준</small>
          </div>
          <button class="close-button" data-close="rankingOverlay" type="button">×</button>
        </div>
        <div id="rankingStatus" class="ranking-status">불러오는 중</div>
        <div id="rankingList" class="ranking-list"></div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="./config.js?v=1.1.0"></script>
  <script src="./experience.js?v=1.1.0"></script>
  <script src="./leaderboard.js?v=1.1.0"></script>
  <script src="./analytics.js?v=1.1.0"></script>
  <script src="./game.js?v=1.1.0"></script>
</body>
</html>
